run:
  type: docker
elbs:
  staging:
  - shorty-staging
  production:
  - shorty
env:
- PG_HOST
- PG_PORT
- PG_USER
- PG_PASSWORD
- PG_SCHEMA
- PG_TABLE
- PG_DATABASE
- PG_SSL
# DynamoDB Links table (replacing Postgres/RDS). Catapult renders this into an
# inline dynamodb-ark-db policy on the ECS task role, granting dynamodb access
# to production--shorty-db-Links (prod) / *--shorty-db-Links (dev). {env} is
# expanded by Catapult. See terraform/{dev,prod} for the table definitions.
databases:
- dynamodb:us-west-2:{env}--shorty-db-Links
resources:
  cpu: 0.5
  max_mem: 1.0
expose:
- name: http
  port: 80
  load_balancer_port: 80
  load_balancer_proto: http
  health_check:
    type: http
    path: /health/check
team: eng-deip
alarms:
- type: InternalErrorAlarm
  severity: major
  parameters:
    threshold: 0.10
  extraParameters:
    errorMinimum: 5
- type: InternalErrorAlarm
  severity: minor
  parameters:
    threshold: 0.02
  extraParameters:
    errorMinimum: 5
pod_config:
  group: org-wide-us-west-2
deploy_config:
  canaryInProd: false
  autoDeployEnvs:
  - clever-dev
  - production
