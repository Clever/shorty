version: 2.1
orbs:
  clever: clever/circleci-orbs@0
jobs:
  # Retained on the legacy path: the orb's go_test uses a single-image executor
  # and cannot attach the postgres/redis sidecars this suite needs.
  test:
    working_directory: ~/go/src/github.com/Clever/shorty
    docker:
    - image: cimg/go:1.24
    - image: circleci/postgres:9.4-alpine-ram
    - image: redis@sha256:858b1677143e9f8455821881115e276f6177221de1c663d0abef9b2fda02d065
    environment:
      GOPRIVATE: github.com/Clever/*
      CIRCLE_ARTIFACTS: /tmp/circleci-artifacts
      CIRCLE_TEST_REPORTS: /tmp/circleci-test-results
    steps:
    - checkout
    - clever/configure_github_app_auth
    - run:
        command: mkdir -p $CIRCLE_ARTIFACTS $CIRCLE_TEST_REPORTS
        name: Set up CircleCI artifacts directories
    - run: make install_deps
    - run:
        name: Install psql client
        command: sudo apt-get update && sudo apt-get install -y postgresql-client
    - run:
        name: Wait for postgres database to be ready
        command: |-
          echo Waiting for postgres
          for i in `seq 1 10`;
          do
            nc -z localhost 5432 && echo Success && exit 0
            echo -n .
            sleep 1
          done
          echo Failed waiting for postgres && exit 1
    - run: bash integration_tests.sh
workflows:
  build_test_publish_deploy:
    jobs:
    - test:
        context:
        - aws-ecr-private
        - github-app-auth
    - clever/go_lint:
        context:
        - github-app-auth
    - clever/build_publish_deploy:
        pre_build_steps:
        - run:
            name: Install deps
            command: make install_deps
        requires:
        - test
        - clever/go_lint
        context:
        - aws-lambda-private
        - aws-ecr-private
        - github-app-auth
    - clever/deploy_apps:
        requires:
        - clever/build_publish_deploy
        filters:
          branches:
            only: master
        context:
        - slingshot-ci
